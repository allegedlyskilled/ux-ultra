<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partsbin catalogue</title>
<style>
  body { font-family: Verdana, sans-serif; font-size: 13px; margin: 0; color: #222; }
  header { background: #2b2b2b; color: #fff; padding: 12px 16px; }
  header h1 { margin: 0; font-size: 18px; }
  .search { padding: 12px 16px; background: #f2f2f2; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid #ddd; padding: 4px 8px; text-align: left; white-space: nowrap; }
  th { background: #e6e6e6; }
</style>
</head>
<body>
<header><h1>Partsbin - electronic components</h1></header>
<div class="search">
  <label>Find a part by SKU <input id="sku" placeholder="PB-10000"></label>
  <button id="go">Go</button>
  <span id="msg"></span>
</div>
<table>
  <thead><tr><th>SKU</th><th>Name</th><th>Category</th><th>Brand</th><th>Package</th><th>Rating</th><th>Price</th><th>Stock</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
  let parts = [];
  const rows = document.getElementById('rows');
  function render(list) {
    rows.innerHTML = list.map(p => `<tr><td>${p.sku}</td><td>${p.name}</td><td>${p.category}</td><td>${p.brand}</td><td>${p.package}</td><td>${p.rating}</td><td>£${p.price.toFixed(2)}</td><td>${p.stock}</td></tr>`).join('');
  }
  fetch('catalogue.json').then(r => r.json()).then(data => { parts = data; render(parts); });
  document.getElementById('go').onclick = () => {
    const hit = parts.filter(p => p.sku === document.getElementById('sku').value);
    document.getElementById('msg').textContent = hit.length ? '' : 'No part with that SKU';
    if (hit.length) render(hit);
  };
</script>
</body>
</html>
